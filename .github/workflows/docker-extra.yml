name: Docker Build and Publish (forked base & extra images)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-extra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: docker.io/alaisterleung/hermes-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          branch="${{ github.ref_name }}"
          # Docker tags cannot contain '/'; sanitize ref names like
          # "feat/named-execution-targets" into "feat-named-execution-targets".
          branch="${branch//\//-}"
          repo="${IMAGE_REPO}"
          base="${repo}:${branch}"
          extra="${repo}:${branch}-extra"
          if [ "${branch}" = "main" ]; then
            extra="${extra},${repo}:latest"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "extra=${extra}" >> "$GITHUB_OUTPUT"
          echo "runtime_image=${repo}:${branch}" >> "$GITHUB_OUTPUT"

      - name: Build base image (Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build extra image (Dockerfile.extra)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.extra
          platforms: linux/amd64
          push: true
          build-args: |
            RUNTIME_IMAGE=${{ steps.tags.outputs.runtime_image }}
          tags: ${{ steps.tags.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
