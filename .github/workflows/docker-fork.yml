name: Docker Build and Publish (fork)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME_BASE: docker.io/alaisterleung/hermes-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          branch="${{ github.ref_name }}"
          sha7="${GITHUB_SHA::7}"
          base="${IMAGE_NAME_BASE}"
          plain="${base}:${branch},${base}:${branch}-${sha7}"
          prod="${base}:${branch}-prod,${base}:${branch}-${sha7}-prod"
          if [ "${branch}" = "main" ]; then
            prod="${prod},${base}:latest"
          fi
          echo "plain=${plain}" >> "$GITHUB_OUTPUT"
          echo "prod=${prod}" >> "$GITHUB_OUTPUT"
          echo "runtime_image=${base}:${branch}" >> "$GITHUB_OUTPUT"

      - name: Build plain image (Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.plain }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build prod image (Dockerfile.prod)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          build-args: |
            RUNTIME_IMAGE=${{ steps.tags.outputs.runtime_image }}
          tags: ${{ steps.tags.outputs.prod }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
